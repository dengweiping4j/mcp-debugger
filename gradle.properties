# Gradle
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

# Plugin coordinates
pluginGroup=com.tool4j
pluginVersion=1.0.0

# Target IntelliJ Platform
#   IC = IntelliJ IDEA Community，也是"IntelliJ Platform 通用基线"：
#   基于它构建的插件可以装进 PyCharm / IDEA / WebStorm / GoLand 等所有 JetBrains IDE。
#   若只想本地 runIde 时启动 PyCharm 验证，可把 platformType 换成 PY（专业版）
#   或 PC（社区版），代码本身无需改动。
platformType=IC
platformVersion=2023.3.8
pluginSinceBuild=233
