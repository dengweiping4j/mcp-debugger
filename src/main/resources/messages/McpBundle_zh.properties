# MCP Debugger —— 中文词表。
#
# 基础词表（McpBundle.properties，无后缀那份）是英文：德语 / 日语 / 法语的 IDE 回落到英文，
# 而不是中文。本文件只覆盖中文，键必须与英文那份完全一致——缺键会回落到英文，
# 所以漏翻不会让界面空掉，但也因此不会报错，改动后请跑 I18nTest 核对两边键集合。
#
# 键是扁平的同一份文件，按区域加前缀（与英文那份一一对应）：
#   panel.  McpPanel（工具栏 / 状态 / 目录树 / 空态卡片）
#   tool.   ToolDetailPanel
#   res.    ResourceDetailPanel
#   prompt. PromptDetailPanel
#   hdr.    RequestHeadersPanel
#   hist.   CallHistoryPanel
#   log.    LogConsole
#   srv.    ServerEditDialog
#   imp.    ImportConfigDialog
#   ui.     Ui / 通用小零件
#   lang.   语言切换
#   err.    协议层与传输层报错（McpException / McpClient / 各 transport）
#   rpc.    JsonRpc / JsonUtil
#   cfg.    McpConfigParser / McpConfigFiles
#   schema. SchemaUtil
#   model.  model/ 里的枚举
#
# 占位符是 {0} {1}，用普通字符串替换（不是 MessageFormat，所以英文里的单引号不会出问题）。
#
# 本文件必须是 UTF-8 且不带 BOM。服务端返回的内容（工具名、工具描述、
# 服务端自己的 error.message）一律不翻——只翻本插件自己产生的文案。

