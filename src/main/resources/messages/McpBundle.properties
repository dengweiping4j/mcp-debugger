# MCP Debugger — English (base bundle).
#
# The base bundle is English on purpose: an IDE running German, Japanese or French
# should fall back here rather than land on Chinese. The Chinese bundle is McpBundle_zh.
#
# Keys are FLAT, one single file, prefixed by area:
#   panel.  McpPanel (toolbar / status / catalog tree / empty card)
#   tool.   ToolDetailPanel
#   res.    ResourceDetailPanel
#   prompt. PromptDetailPanel
#   hdr.    RequestHeadersPanel
#   hist.   CallHistoryPanel
#   log.    LogConsole
#   srv.    ServerEditDialog
#   imp.    ImportConfigDialog
#   ui.     Ui / shared widgets
#   lang.   language switching
#   err.    protocol + transport failures (McpException, McpClient, transports)
#   rpc.    JsonRpc / JsonUtil
#   cfg.    McpConfigParser / McpConfigFiles
#   schema. SchemaUtil
#   model.  model/ enums
#
# Placeholders are {0}, {1}, ... replaced by plain substitution (NOT MessageFormat,
# so a lone apostrophe in English is safe).
#
# This file must stay UTF-8 WITHOUT a BOM, and build.gradle.kts must not enable
# expand() on processResources (it would eat every $ as a placeholder).
# Never translate text that comes from the server (tool names, descriptions,
# server-side error messages) — only strings this plugin produces.

# ------------------------------------------------------------------ language

# Language names stay in their own script in both bundles — that is the convention
# for a language picker, and it avoids showing an English label inside a Chinese UI.

lang.name.zh=中文
lang.name.en=English
# Two-letter chip on the status-strip button. It shows the language you get by clicking,
# so it is "EN" while the UI is Chinese — same shape as the Connect / Disconnect button.
